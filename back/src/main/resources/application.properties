spring.application.name=LaPlumeVirtuel
spring.datasource.url=jdbc:h2:mem:laplumevirtueldb
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
server.port=8080

# Swagger/OpenAPI Properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Laplumevirtuelle-realm

# Keycloak Configuration
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=Laplumevirtuelle-realm
keycloak.resource=angular-app-LPV
keycloak.public-client=true
keycloak.principal-attribute=preferred_username
keycloak.use-resource-role-mappings=true
keycloak.confidential-port=0

