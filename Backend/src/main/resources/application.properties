spring.application.name=LaPlumeVirtuel
spring.datasource.url=jdbc:h2:mem:laplumevirtueldb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# MongoDB Configuration (user profiles / recommendation context)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/lpvDB}

# NLP Microservice Configuration
nlp.base-url=${NLP_BASE_URL:http://localhost:5001}
nlp.connect-timeout-ms=${NLP_CONNECT_TIMEOUT_MS:3000}
nlp.read-timeout-ms=${NLP_READ_TIMEOUT_MS:10000}

# JWT Configuration - Use environment variable in production
jwt.secret=${JWT_SECRET:laPlumevirtuelle2024SecretKeyForJWTTokenGenerationAndValidationMustBeLongerThan256bits!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Open Library API Configuration (Free, no API key required)
openlibrary.api.url=https://openlibrary.org/search.json

# Swagger/OpenAPI Properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true