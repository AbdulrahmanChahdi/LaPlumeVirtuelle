spring.application.name=LaPlumeVirtuel
spring.datasource.url=jdbc:h2:mem:laplumevirtueldb
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration - Use environment variable in production
jwt.secret=${JWT_SECRET:laPlumevirtuelle2024SecretKeyForJWTTokenGenerationAndValidationMustBeLongerThan256bits!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Books API Configuration
google.books.api.url=https://www.googleapis.com/books/v1/volumes
google.books.api.key=${GOOGLE_BOOKS_API_KEY:}

# Swagger/OpenAPI Properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true