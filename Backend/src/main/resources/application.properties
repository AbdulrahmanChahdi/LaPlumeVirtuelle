spring.application.name=LaPlumeVirtuel
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lpvDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration - Use environment variable in production
jwt.secret=${JWT_SECRET:laPlumevirtuelle2024SecretKeyForJWTTokenGenerationAndValidationMustBeLongerThan256bits!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Open Library API Configuration (Free, no API key required)
openlibrary.api.url=https://openlibrary.org/search.json

# Swagger/OpenAPI Properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true