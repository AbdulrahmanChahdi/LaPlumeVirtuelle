<div class="validation-container">
  <div class="validation-card" [ngClass]="{'success': type === 'success', 'error': type === 'error'}">
    <div class="icon">
      <i class="fas" [ngClass]="{'fa-check-circle': type === 'success', 'fa-times-circle': type === 'error'}"></i>
    </div>
    <h2>{{ type === 'success' ? 'Succès' : 'Erreur' }}</h2>
    <p>{{ message }}</p>
    <div class="redirect-message">
      Redirection automatique dans quelques secondes...
    </div>
  </div>
</div>
