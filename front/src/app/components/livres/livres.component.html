<div class="livres-container">
  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearch($event)"
      placeholder="Rechercher un livre..."
      class="search-input"
    >
    <select
      [(ngModel)]="selectedCategory"
      (ngModelChange)="onCategoryChange($event)"
      class="category-select"
    >
      <option value="">Toutes les catégories</option>
      <option *ngFor="let category of categories" [value]="category.id">
        {{category.nom}}
      </option>
    </select>
  </div>

  <!-- Message d'erreur -->
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Chargement des livres...</p>
  </div>

  <!-- Grille de livres -->
  <div *ngIf="!loading && !error" class="livres-grid">
    <div *ngFor="let livre of filteredLivres" class="livre-card">
      <div class="livre-info">
        <h3 class="livre-titre">{{livre.titre}}</h3>
        <p class="livre-auteur">{{livre.auteur.nom}}</p>
        <p class="livre-categorie">{{livre.categorie.nom}}</p>
        <p class="livre-details">
          <span class="annee">{{livre.anneeEdition}}</span> |
          <span class="pages">{{livre.nombreDePage}} pages</span> |
          <span class="langue">{{livre.langue}}</span>
        </p>
        <p class="livre-resume">{{livre.resume}}</p>
        <div class="livre-status" [class.disponible]="livre.disponible">
          {{livre.disponible ? 'Disponible' : 'Non disponible'}}
        </div>
        <div class="livre-actions">
          <button class="btn-details">Voir détails</button>
          <button class="btn-lire" [disabled]="!livre.disponible">
            {{livre.disponible ? 'Lire' : 'Indisponible'}}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Message si aucun livre -->
  <div *ngIf="!loading && !error && filteredLivres.length === 0" class="no-results">
    <p>Aucun livre ne correspond à votre recherche.</p>
  </div>
</div>
