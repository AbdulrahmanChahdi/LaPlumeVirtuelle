<div class="podcasts-container">
  <div class="header">
    <h1>Gestion des podcasts</h1>
    <button class="btn btn-primary" routerLink="new">
      <i class="fas fa-plus"></i> Nouveau podcast
    </button>
  </div>

  <!-- Message d'erreur -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Tableau des podcasts -->
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Titre</th>
          <th>Catégorie</th>
          <th>Durée</th>
          <th>Date de publication</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let podcast of podcasts">
          <td>{{ podcast.id }}</td>
          <td>
            <img [src]="podcast.imageUrl" [alt]="podcast.titre" class="podcast-image">
          </td>
          <td>{{ podcast.titre }}</td>
          <td>{{ podcast.categorie.nom }}</td>
          <td>{{ podcast.duree }}</td>
          <td>{{ podcast.datePublication | date }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" [routerLink]="[podcast.id, 'edit']">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deletePodcast(podcast.id)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- État de chargement -->
  <div *ngIf="loading" class="loading">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Message si aucun podcast -->
  <div *ngIf="!loading && podcasts.length === 0" class="no-data">
    <p>Aucun podcast trouvé</p>
  </div>
</div>
